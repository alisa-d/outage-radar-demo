name: e2e
on: [push, pull_request]
jobs:
  main-path:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: cd e2e && npm ci && npx playwright install --with-deps chromium
      - run: e2e/run.sh
