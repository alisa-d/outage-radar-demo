services:
  postgres:
    image: postgres:17-alpine
    environment: { POSTGRES_PASSWORD: postgres, POSTGRES_DB: outage }
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d outage"]
      interval: 2s
      retries: 30

  migrate:
    build: .
    command: ["migrate"]
    environment: &appenv
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/outage?sslmode=disable
      ROLE: all
      DATA_KEY: AAECAwQFBgcICQoLDA0ODxAREhMUFRYXGBkaGxwdHh8= # dev only, never reuse
      SMTP_ADDR: mailpit:1025
      TURNSTILE_SECRET: 1x0000000000000000000000000000000AA # Cloudflare test secret (always passes); real one by env in prod
      OIDC_ISSUER: http://keycloak:8080/realms/outage
    depends_on: { postgres: { condition: service_healthy } }

  app:
    build: .
    environment: *appenv
    depends_on: { migrate: { condition: service_completed_successfully } }

  # Local development only (never in compose.prod.yaml). Dev users operator/operator and privacy/privacy must enrol a TOTP app on first sign-in.
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: ["start-dev", "--import-realm"]
    environment: { KC_BOOTSTRAP_ADMIN_USERNAME: admin, KC_BOOTSTRAP_ADMIN_PASSWORD: admin }
    volumes: ["./deploy/keycloak/outage-realm.json:/opt/keycloak/data/import/outage-realm.json:ro"]
    ports: ["8082:8080"]

  frontend:
    build: ./web
    ports: ["8081:80"]
    depends_on: [app]

  mailpit:
    image: axllent/mailpit
    ports: ["8025:8025"]

  # Observability: Prometheus scrapes the app's METRICS_ADDR, Alertmanager emails engineering (to Mailpit here), Grafana is provisioned.
  prometheus:
    image: prom/prometheus:v3.5.0
    volumes:
      - ./deploy/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/observability/rules.yml:/etc/prometheus/rules.yml:ro
    ports: ["${PROMETHEUS_PORT:-9090}:9090"]
    depends_on: [app, alertmanager]

  alertmanager:
    image: prom/alertmanager:v0.28.1
    volumes: ["./deploy/observability/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro"]
    ports: ["${ALERTMANAGER_PORT:-9093}:9093"]
    depends_on: [mailpit]

  grafana:
    image: grafana/grafana:12.1.0
    environment: { GF_AUTH_ANONYMOUS_ENABLED: "true", GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer }
    volumes:
      - ./deploy/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["${GRAFANA_PORT:-3000}:3000"]
    depends_on: [prometheus]
