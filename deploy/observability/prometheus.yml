global:
  scrape_interval: 15s
  evaluation_interval: 15s
rule_files: [/etc/prometheus/rules.yml]
alerting:
  alertmanagers:
    - static_configs: [{ targets: ["alertmanager:9093"] }]
scrape_configs:
  - job_name: outage-radar
    static_configs: [{ targets: ["app:9100"] }] # every role serves /metrics on METRICS_ADDR
